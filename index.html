<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@700;800;900&family=Space+Grotesk:wght@500;700&family=Sora:wght@600;700&display=swap"
    />
    <link rel="icon" type="image/png" href="/logo-wh-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshour | AI-Powered Career Platform</title>
    <meta
      name="description"
      content="Workshour is an AI-powered career platform for job search, resume building, and career insights."
    />
    <meta
      name="keywords"
      content="AI career platform, job search, resume builder, resume templates, career insights, career trends, AI copilot, job matching, workshour"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://workshour.com/" />

    <meta property="og:title" content="Workshour | AI-Powered Career Platform" />
    <meta
      property="og:description"
      content="Workshour is an AI-powered career platform for job search, resume building, and career insights."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://workshour.com/" />
    <meta property="og:image" content="https://workshour.com/logo-wh-transparent.png" />
    <meta property="og:image:alt" content="Workshour logo" />
    <meta property="og:site_name" content="Workshour" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Workshour | AI-Powered Career Platform" />
    <meta
      name="twitter:description"
      content="Workshour is an AI-powered career platform for job search, resume building, and career insights."
    />
    <meta name="twitter:image" content="https://workshour.com/logo-wh-transparent.png" />
    <meta name="twitter:image:alt" content="Workshour logo" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Workshour",
        "url": "https://workshour.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://workshour.com/jobs?query={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
